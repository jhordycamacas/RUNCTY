# Local backend in Docker: `docker compose up -d --build`
# Ports are published on 127.0.0.1 only: the emulators have no authentication.
# - firebase: emulators (Auth 9099, Firestore 8080, Functions 5001, Storage 9199, UI http://localhost:4000)
# - seed: loads Loja, roles, the admin and sample routes once the emulators are ready
# - admin: panel at http://localhost:3100
# The mobile app (Metro) runs on the host: `adb reverse` the ports, then `npm start` in mobile/.
services:
  firebase:
    build:
      context: .
      dockerfile: docker/firebase.Dockerfile
    image: runcty-firebase
    container_name: runcty-firebase
    init: true
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4400:4400"
      - "127.0.0.1:4500:4500"
      - "127.0.0.1:9150:9150"
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:9199:9199"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:8080/'),fetch('http://127.0.0.1:9099/')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  seed:
    image: runcty-firebase
    container_name: runcty-seed
    command: ["npx", "tsx", "scripts/seed-emulator.ts"]
    environment:
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      GCLOUD_PROJECT: demo-runcty
    depends_on:
      firebase:
        condition: service_healthy
    restart: "no"

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_USE_EMULATORS: "true"
        NEXT_PUBLIC_EMULATOR_HOST: 127.0.0.1
    image: runcty-admin
    container_name: runcty-admin
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - firebase
    restart: unless-stopped
