# Local backend in Docker: `docker compose up -d --build`
# Ports are published on 127.0.0.1 only: the emulators have no authentication.
# - firebase: emulators (Auth 9099, Firestore 8080, Functions 5001, Storage 9199, UI http://localhost:4000)
# - api: Django REST API at http://localhost:8000/api/v1 against the emulators (debug mode, demo data only)
# - seed: loads Loja, roles, the admin and sample routes once (`python manage.py seed` in the api image)
# - admin: panel at http://localhost:3100
# The mobile app (Metro) runs on the host: `adb reverse` the ports, then `npm start` in frontend/mobile/.

# Hardening shared by the services we build. Nothing here needs a Linux capability.
x-hardened: &hardened
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# The API and the seed talk to the emulators by service name. DJANGO_DEBUG=true is what allows
# emulator hosts and a demo-* project; never copy this block to a real deployment.
x-api-environment: &api-environment
  DJANGO_DEBUG: "true"
  FIREBASE_PROJECT_ID: demo-runcty
  FIRESTORE_EMULATOR_HOST: firebase:8080
  FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
  FIREBASE_STORAGE_EMULATOR_HOST: firebase:9199
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:8100

services:
  firebase:
    <<: *hardened
    build:
      context: .
      dockerfile: docker/firebase.Dockerfile
    image: runcty-firebase
    container_name: runcty-firebase
    init: true
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4400:4400"
      - "127.0.0.1:4500:4500"
      - "127.0.0.1:9150:9150"
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:9199:9199"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:8080/'),fetch('http://127.0.0.1:9099/')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    restart: unless-stopped

  api:
    <<: *hardened
    build:
      context: ./backend
    image: runcty-api
    container_name: runcty-api
    init: true
    environment: *api-environment
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      firebase:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

  seed:
    <<: *hardened
    # Same image as the api, so waiting for it also guarantees the image is built.
    image: runcty-api
    container_name: runcty-seed
    command: ["python", "manage.py", "seed"]
    environment: *api-environment
    depends_on:
      firebase:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    restart: "no"

  admin:
    <<: *hardened
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_USE_EMULATORS: "true"
        NEXT_PUBLIC_EMULATOR_HOST: 127.0.0.1
    image: runcty-admin
    container_name: runcty-admin
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - firebase
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
